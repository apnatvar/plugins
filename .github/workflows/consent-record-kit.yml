name: Consent Record Kit CI
on:
  push:
    paths: ['consent-record-kit/**', '.github/workflows/consent-record-kit.yml']
  pull_request:
    paths: ['consent-record-kit/**', '.github/workflows/consent-record-kit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: consent-record-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: consent-record-kit/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run check:consumer
