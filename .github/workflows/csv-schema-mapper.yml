name: CSV Schema Mapper
on:
  push:
    paths: ['csv-schema-mapper/**', '.github/workflows/csv-schema-mapper.yml']
  pull_request:
    paths: ['csv-schema-mapper/**', '.github/workflows/csv-schema-mapper.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: csv-schema-mapper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
          cache-dependency-path: csv-schema-mapper/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:security
      - run: npm audit --audit-level=low
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run check:consumer
