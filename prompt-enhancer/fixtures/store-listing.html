<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Composer product preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #172033;
        background: #ebe7dc;
      }
      body {
        min-height: 100vh;
        margin: 0;
        background-image:
          linear-gradient(#dcd6c8 1px, transparent 1px),
          linear-gradient(90deg, #dcd6c8 1px, transparent 1px);
        background-size: 32px 32px;
      }
      main {
        width: min(1080px, calc(100% - 64px));
        margin: 0 auto;
        padding: 64px 0;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        border-bottom: 1px solid #a8a29a;
        padding-bottom: 22px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #3659d9;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 42px;
        letter-spacing: -0.04em;
      }
      header p:last-child {
        margin: 0;
        color: #64748b;
        font-size: 14px;
      }
      .workspace {
        margin-top: 56px;
        border: 1px solid #aaa39a;
        border-radius: 18px;
        background: rgb(248 250 252 / 0.9);
        box-shadow: 0 24px 70px rgb(23 32 51 / 0.12);
        overflow: hidden;
      }
      .workspace-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #d6d3d1;
        padding: 14px 18px;
        color: #64748b;
        font-size: 13px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3659d9;
        content: '';
      }
      .editor-wrap {
        padding: 70px 48px 50px;
      }
      label {
        display: block;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 650;
      }
      textarea {
        width: 100%;
        min-height: 170px;
        resize: none;
        border: 1px solid #94a3b8;
        border-radius: 13px;
        background: #fff;
        color: #172033;
        padding: 18px;
        font:
          15px/1.65 'Segoe UI',
          system-ui,
          sans-serif;
        outline: none;
      }
      textarea:focus {
        border-color: #3659d9;
        box-shadow: 0 0 0 3px rgb(54 89 217 / 0.13);
      }
      .hint {
        margin: 12px 0 0;
        color: #64748b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Writing workspace</p>
          <h1>Compose a clearer prompt.</h1>
        </div>
        <p>Tools by Brownsmith Dynamics</p>
      </header>
      <section class="workspace">
        <div class="workspace-bar">
          <span>Draft editor</span>
          <span class="status">Prompt Composer active</span>
        </div>
        <div class="editor-wrap">
          <label for="prompt">Your prompt</label>
          <textarea id="prompt"></textarea>
          <p class="hint">Review, format or apply a reusable snippet before you send.</p>
        </div>
      </section>
    </main>
  </body>
</html>
